
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Invoice Kantin</title>
    <style>
        body {
            font-family: Arial;
            background: #f0fdf4;
            padding: 20px;
        }
        .container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 7px 0 15px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #15803d;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        #hasil {
            margin-top: 20px;
            line-height: 1.8;
        }
        @media print {
            .form, .tombol-cetak { display: none; }
            body { background: white; }
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Invoice Kantin Sekolah</h2>

    <div class="form">
        <label>Nama Pembeli</label>
        <input type="text" id="nama" placeholder="Masukkan nama pembeli">

        <h3>Barang 1</h3>
        <label>Nama Barang</label>
        <input type="text" id="barang1" value="Nasi Goreng">
        <label>Harga Satuan (Rp)</label>
        <input type="number" id="harga1" value="15000" min="0">
        <label>Jumlah</label>
        <input type="number" id="jumlah1" value="2" min="0">

        <h3>Barang 2</h3>
        <label>Nama Barang</label>
        <input type="text" id="barang2" value="Es Teh">
        <label>Harga Satuan (Rp)</label>
        <input type="number" id="harga2" value="5000" min="0">
        <label>Jumlah</label>
        <input type="number" id="jumlah2" value="1" min="0">

        <h3>Barang 3</h3>
        <label>Nama Barang</label>
        <input type="text" id="barang3" value="Roti">
        <label>Harga Satuan (Rp)</label>
        <input type="number" id="harga3" value="7000" min="0">
        <label>Jumlah</label>
        <input type="number" id="jumlah3" value="2" min="0">

        <button onclick="hitung()">Hitung Total Belanja</button>
    </div>

    <div id="hasil"></div>

    <button class="tombol-cetak" onclick="window.print()">
        Cetak / Simpan PDF
    </button>
</div>

<script>
function hitung() {
    let nama = document.getElementById("nama").value.trim();

    if (!nama) {
        alert("Nama pembeli wajib diisi!");
        return;
    }

    let total = 0;
    let daftar = "";

    for (let i = 1; i <= 3; i++) {
        let barang = document.getElementById("barang" + i).value.trim();
        let harga = document.getElementById("harga" + i).value;
        let jumlah = document.getElementById("jumlah" + i).value;

        if (!barang || harga === "" || jumlah === "") {
            alert("Lengkapi semua data barang!");
            return;
        }

        harga = Number(harga);
        jumlah = Number(jumlah);

        if (harga < 0 || jumlah < 0 ||
            !Number.isFinite(harga) || !Number.isFinite(jumlah) ||
            !Number.isInteger(jumlah)) {
            alert("Harga harus positif dan jumlah harus bilangan bulat nonnegatif!");
            return;
        }

        let subtotal = harga * jumlah;
        total += subtotal;

        daftar += `
            <p>${barang} (${jumlah} x ${rupiah(harga)})
            = ${rupiah(subtotal)}</p>
        `;
    }

    let diskon = total >= 50000 ? total * 0.1 : 0;
    let bayar = total - diskon;

    console.log("Pembeli:", nama);
    console.log("Total Belanja:", rupiah(total));
    console.log("Diskon:", rupiah(diskon));
    console.log("Total Bayar:", rupiah(bayar));

    document.getElementById("hasil").innerHTML = `
        <hr>
        <h3>INVOICE PEMBELIAN</h3>
        <p><b>Pembeli:</b> ${aman(nama)}</p>
        ${daftar}
        <hr>
        <b>Total Belanja:</b> ${rupiah(total)}<br>
        <b>Diskon:</b> ${rupiah(diskon)}<br>
        <h3>Total Bayar: ${rupiah(bayar)}</h3>
    `;
}

function rupiah(angka) {
    return "Rp" + angka.toLocaleString("id-ID");
}

function aman(teks) {
    let el = document.createElement("span");
    el.textContent = teks;
    return el.innerHTML;
}
</script>
</body>
</html>
